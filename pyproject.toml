[tool.uv.workspace]
members = [
  "planes/agent-control-plane/services/*",
  "planes/workflow-plane/services/*",
  "planes/knowledge-plane/services/*",
  "planes/tool-integration-plane/services/*",
  "planes/operations-governance-plane/services/*",
  "shared/python/*",
]

[tool.uv.sources]
shared-core = { workspace = true }
shared-contracts = { workspace = true }

[project]
name = "light-weight-agentic-engineering"
version = "0.1.0"
description = "Enterprise Light-Weight Agentic Engineering Monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "langgraph>=0.2.20",
  "langchain-core>=0.3.0",
  "temporalio>=1.7.0",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.2",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.25.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=planes"
testpaths = ["tests", "planes"]
